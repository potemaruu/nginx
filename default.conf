server {
    listen 80;
    server_name _;

    # フロントエンド（Next.js）へ
    location / {
        proxy_pass http://c-bbs-fe:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # バックエンド（Spring Boot）へ
    location /api/ {
        # /api/threads へのアクセスを http://c-bbs-be:8080/threads に変換して転送
        proxy_pass http://c-bbs-be:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}