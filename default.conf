# 転送先のコンテナ名を毎回 Docker の DNS で引く（転送先を変数にした location で使う）。
# → 掲示板などのコンテナが止まっていても nginx は起動でき、そのサイトだけ 502 になる。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # フロントエンド（Next.js）へ
    location / {
        set $bbs_fe c-bbs-fe:3000;
        proxy_pass http://$bbs_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # バックエンド（Spring Boot）へ
    location /api/ {
        # /api/threads へのアクセスを http://c-bbs-be:8080/threads に変換して転送
        set $bbs_be c-bbs-be:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$bbs_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 自分専用ページの入口（https://hub.purometa.net/）。中身は ~/hub（potemaruu/hub）
server {
    listen 80;
    server_name hub.purometa.net;

    root /srv/hub;
    index index.html;

    # 家の中だけのリンク一覧は外に出さない
    location /lan/ { return 404; }
    location ~ /\. { deny all; }
}

# 家の中（LAN）から IP で開いたとき（http://192.168.40.80/）。LAN 以外は 403
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 192.168.40.80;

    allow 192.168.40.0/24;
    deny all;

    root /srv/hub;
    index index.html;
    location ~ /\. { deny all; }

    # 株の画面（StockAI の Streamlit。WebSocket を通す）
    location = /stock { return 301 /stock/; }
    location /stock/ {
        set $stockai c-stockai:8501;
        proxy_pass http://$stockai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}